{% extends 'base.html' %}

{% block content %}
<style>
    .container {
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }

    thead {
        background-color: #f4f4f4;
    }

    th, td {
        text-align: left;
        padding: 10px;
        border: 1px solid #ddd;
    }

    th {
        font-weight: bold;
        color: #555;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    label {
        font-size: 1em;
        color: #555;
    }

    input[type="number"] {
        padding: 5px;
        font-size: 1em;
        border: 1px solid #ddd;
        border-radius: 5px;
        width: 60px;
        box-sizing: border-box;
    }

    button {
        padding: 5px 10px;
        font-size: 1em;
        color: white;
        background: #007bff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background: #0056b3;
    }

    p {
        font-size: 0.9em;
        color: #777;
    }
</style>

<div class="container">
    <h1>Add Item to {{ cart.name }}</h1>
    <input
        type="text"
        id="searchAvailableItems"
        placeholder="Search available items..."
        style="width: 100%; padding: 10px; margin-bottom: 20px;"
    />
    <table id="availableItemsTable">
        <tr>
            <th>Item</th>
            <th>Description</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        {% for item in available_items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.price }}</td>
            <td>
                <form method="POST" action="{% url 'add_item' cart.id %}">
                    {% csrf_token %}
                    <input type="hidden" name="item_id" value="{{ item.id }}">
                    <input type="number" name="quantity" value="1" min="1" style="width: 50px;">
                    <button type="submit">Add</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

<script>
    document.getElementById("searchAvailableItems").addEventListener("input", function () {
        const filter = this.value.toLowerCase();
        const rows = document.querySelectorAll("#availableItemsTable tr:not(:first-child)");
        rows.forEach(row => {
            const itemName = row.cells[0].textContent.toLowerCase();
            row.style.display = itemName.includes(filter) ? "" : "none";
        });
    });
</script>

{% endblock %}

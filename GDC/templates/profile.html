{% extends 'base.html' %}

{% block content %}
<style>
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-size: 2em;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
    }

    p {
        font-size: 1em;
        color: #555;
        margin-bottom: 20px;
        text-align: center;
    }

    .profile-info {
        list-style: none;
        padding: 0;
        margin: 20px 0;
    }

    .profile-info li {
        margin: 10px 0;
        font-size: 1em;
        color: #555;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #ddd;
        padding-bottom: 5px;
    }

    .profile-info li strong {
        color: #333;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        font-size: 1em;
        color: white;
        background: #007bff;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        text-align: center;
        transition: background 0.3s ease;
    }

    .btn:hover {
        background: #0056b3;
    }

    .btn-container {
        text-align: center;
        margin-top: 20px;
    }
</style>

<div class="container">
    <h1>Your Profile</h1>
    <p>Welcome, {{ user.username }}!</p>
    <ul class="profile-info">
        <li><strong>Email:</strong> {{ user.email }}</li>
        <li><strong>Joined:</strong> {{ user.date_joined|date:"F d, Y" }}</li>
    </ul>
    <div class="btn-container">
        <a href="{% url 'home' %}" class="btn">Back to Home</a>
    </div>
</div>
{% endblock %}

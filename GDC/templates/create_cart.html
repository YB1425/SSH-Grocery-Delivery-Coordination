{% extends 'base.html' %}

{% block content %}
<style>
    /* General Container Style */
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        font-size: 1em;
        color: #555;
    }

    input[type="text"] {
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ddd;
        border-radius: 5px;
        width: 100%;
        box-sizing: border-box;
    }

    button {
        padding: 10px 15px;
        font-size: 1em;
        color: white;
        background: #007bff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background: #0056b3;
    }
</style>

<div class="container">
    <h1>Create a New Shared Cart</h1>
    <form method="post">
        {% csrf_token %}
        <label for="cart_name">Cart Name:</label>
        <input type="text" name="cart_name" required>
        <button type="submit">Create Cart</button>
    </form>
</div>
{% endblock %}

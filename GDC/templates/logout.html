{% extends 'base.html' %}

{% block content %}
<style>
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h1 {
        font-size: 2em;
        margin-bottom: 20px;
        color: #333;
    }

    p {
        font-size: 1em;
        color: #555;
        margin-bottom: 20px;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .btn {
        display: inline-block;
        padding: 10px 15px;
        font-size: 1em;
        color: white;
        background: #007bff;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .btn:hover {
        background: #0056b3;
    }

    .btn-cancel {
        background: #dc3545;
    }

    .btn-cancel:hover {
        background: #c82333;
    }
</style>

<div class="container">
    <h1>Logout</h1>
    <p>Are you sure you want to log out?</p>
    <div class="btn-container">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn">Yes, Logout</button>
        </form>
        <a href="{% url 'home' %}" class="btn btn-cancel">Cancel</a>
    </div>
</div>
{% endblock %}

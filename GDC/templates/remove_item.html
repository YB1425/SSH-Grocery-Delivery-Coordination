{% extends 'base.html' %}

{% block content %}
<style>
    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #333;
    }

    p {
        font-size: 1em;
        color: #555;
        margin-bottom: 20px;
    }

    form {
        display: inline-block;
    }

    button {
        padding: 10px 15px;
        font-size: 1em;
        color: white;
        background: #dc3545;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    button:hover {
        background: #c82333;
    }

    a {
        display: inline-block;
        padding: 10px 15px;
        font-size: 1em;
        color: #007bff;
        text-decoration: none;
        border: 1px solid #007bff;
        border-radius: 5px;
        transition: background 0.3s ease, color 0.3s ease;
        margin-left: 10px;
    }

    a:hover {
        background: #007bff;
        color: white;
    }
</style>

<div class="container">
    <h1>Remove {{ cart_item.item.name }} from {{ cart.name }}</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to remove this item?</p>
        <button type="submit">Yes, Remove</button>
        <a href="{% url 'shared_cart' cart.id %}">Cancel</a>
    </form>
</div>
{% endblock %}

name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GDC/requirements.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -U user; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_NAME: mydatabase
          DB_USER: user
          DB_PASSWORD: password
        run: |
          cd GDC
          python manage.py migrate

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_NAME: mydatabase
          DB_USER: user
          DB_PASSWORD: password
        run: |
          cd GDC
          pytest
